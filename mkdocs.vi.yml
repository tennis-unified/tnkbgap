site_name: Trung Tâm Tri Thức Quần Vợt
use_directory_urls: true
site_description: Sân Thống Nhất — chuyên luận 16 chương về cơ sinh học quần vợt, thị giác thần kinh, di chuyển, chiến thuật, y học thể thao và tâm lý thi đấu.
site_author: Henry Pham
copyright: © 2026 Henry Phạm Đức · Tennis Future Lab Research · Toàn bộ nội dung phục vụ mục đích giáo dục.
docs_dir: docs-vi
site_dir: site/vi
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Chuyển sang chế độ sáng
  font:
    text: DM Sans
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.prev_next
    - navigation.footer
  language: vi
extra_css:
  - assets/css/site.css
extra:
  alternate:
    - name: English
      link: ../
      lang: en
    - name: Tiếng Việt
      link: ./
      lang: vi
markdown_extensions:
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables
nav:
  - Trang chủ: index.md
  - "Sách — Sân Thống Nhất":
      - "Tổng quan & Mục lục": book/index.md
      - "Ch 8: Lưỡi Dao Cổ Điển": book/chapter-08-the-classical-blade.md
      - "Ch 9: Động Cơ Tay Không Thuận": book/chapter-09-the-non-dominant-engine.md
      - "Ch 10: Chiến Tranh Cận Chiến": book/chapter-10-point-blank-warfare.md
      - "Ch 11: Chinh Phục Không Trung": book/chapter-11-aerial-conquest.md
