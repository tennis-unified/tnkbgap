site_name: Trung Tâm Tri Thức Quần Vợt
use_directory_urls: true
site_description: Sân Thống Nhất — chuyên luận 16 chương về cơ sinh học quần vợt, thị giác thần kinh, di chuyển, chiến thuật, y học thể thao và tâm lý thi đấu.
site_author: Henry Pham
copyright: © 2026 Henry Phạm Đức · Tennis Future Lab Research · Toàn bộ nội dung phục vụ mục đích giáo dục.
docs_dir: docs-vi
site_dir: site/vi
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Chuyển sang chế độ sáng
  font:
    text: DM Sans
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.prev_next
    - navigation.footer
  language: vi
extra_css:
  - assets/css/site.css
extra:
  alternate:
    - name: English
      link: ../
      lang: en
    - name: Tiếng Việt
      link: ./
      lang: vi
markdown_extensions:
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables
nav:
  - "← Thư Viện Tennis Thống Nhất": https://tennis-unified.github.io/vi/
  - Trang chủ: index.md
  - "Sách — Sân Thống Nhất":
      - "Tổng quan & Mục lục": book/index.md
      - "Ch 1: Động Cơ Ẩn Giấu": book/chapter-01-the-hidden-engine.md
      - "Ch 2: Con Mắt Satori": book/chapter-02-the-satori-eye.md
      - "Ch 3: Trọng Lực Động": book/chapter-03-dynamic-gravity.md
      - "Ch 4: Cờ Chớp Trên Sân Bê Tông": book/chapter-04-blitz-chess-on-concrete.md
      - "Ch 5: Khẩu Đại Bác Trên Cao": book/chapter-05-the-cannon-above.md
      - "Ch 6: Cánh Cổng Sắt": book/chapter-06-the-iron-gate.md
      - "Ch 7: Cú Thuận Tay Hiện Đại": book/chapter-07-the-modern-forehand.md
      - "Ch 8: Lưỡi Kiếm Cổ Điển": book/chapter-08-the-classical-blade.md
      - "Ch 9: Động Cơ Của Tay Không Thuận": book/chapter-09-the-non-dominant-engine.md
      - "Ch 10: Cận Chiến Nghẹt Thở": book/chapter-10-point-blank-warfare.md
      - "Ch 11: Chinh Phục Bầu Trời": book/chapter-11-aerial-conquest.md
      - "Ch 12: Hủy Diệt Bằng Nhung Lụa": book/chapter-12-velvet-destruction.md
      - "Ch 13: Vận Động Viên Bất Khả Xâm Phạm": book/chapter-13-the-bulletproof-athlete.md
      - "Ch 14: Pháo Đài Nội Tâm": book/chapter-14-the-fortress-within.md
      - "Ch 15: Cỗ Máy Vi Mô": book/chapter-15-the-microscopic-machine.md
      - "Ch 16: Tâm Trí Đồng Bộ": book/chapter-16-the-synchronized-mind.md
  - "Mục Thư Viện Chính":
      - "Nền tảng căn bản (Fundamentals)": https://tennis-unified.github.io/vi/fundamentals/
      - "Phân tích cú đánh (Stroke Analysis)": https://tennis-unified.github.io/vi/stroke-analysis/
      - "Thư viện video HLV (Coach Library)": https://tennis-unified.github.io/vi/coach-video-library/
      - "Thư viện video kỹ thuật": https://tennis-unified.github.io/vi/tennis-video-library/
      - "Từ điển kỹ thuật (Technical Wiki)": https://tennis-unified.github.io/vi/tennis-wiki-reference/
      - "Thư viện tham khảo (Reference)": https://tennis-unified.github.io/vi/reference-library/
      - "Cú đánh chuyên biệt (Specialty Shots)": https://tennis-unified.github.io/vi/specialty-shots/
      - "Chiến thuật đánh đôi (Doubles)": https://tennis-unified.github.io/vi/doubles/
      - "Cơ sinh học & Thần kinh học": https://tennis-unified.github.io/vi/biomechanics-neurology/
  - "Báo cáo khoảng trống":
      - "Cấp 1 — Giá trị cao": reports/tier-1-high-value-gaps.md
      - "Cấp 2 — Độ sâu chủ đề": reports/tier-2-topic-depth-gaps.md
      - "Cấp 3 — Chuyên biệt": reports/tier-3-niche-specialty.md
  - "Nghiên cứu hiện đại":
      - "Quần vợt hiện đại 2024–2026": research/modern-tennis-2024-2026.md
      - "Nguồn uy tín": research/authoritative-sources.md
  - "Kỹ thuật cú đánh":
      - "Đồng thuận kỹ thuật hiện đại": strokes/modern-stroke-consensus.md
